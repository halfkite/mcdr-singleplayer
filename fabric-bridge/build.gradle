plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def stableVersion = project.version.toString()
def releaseBuild = providers.gradleProperty('releaseBuild').map { it.toBoolean() }.getOrElse(false)
if (!releaseBuild) {
    def defaultTimestamp = new Date().format('yyyyMMdd-HHmm', TimeZone.getTimeZone('UTC'))
    def buildTimestamp = providers.gradleProperty('buildTimestamp').getOrElse(defaultTimestamp)
    if (!(buildTimestamp ==~ /\d{8}-\d{4}/)) {
        throw new GradleException('buildTimestamp must use UTC YYYYMMDD-HHMM format')
    }
    version = "${stableVersion}-dev.${buildTimestamp.replace('-', '.')}"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('bundleInstaller', Zip) {
    archiveFileName = 'mcdr-install.zip'
    destinationDirectory = layout.buildDirectory.dir('installer')
    from('../python') { into 'runtime'; exclude '**/__pycache__/**', '**/*.pyc', 'mcdreforged.plugin.json', '.gitignore' }
    from('../python/bridge_bootstrap.py')
    from('../python') { into 'bridge-plugin'; exclude '**/__pycache__/**', '**/*.pyc', 'bridge_*.py', '.gitignore' }
    from('../prime-backup-adapter') { into 'adapter-plugin'; exclude '**/__pycache__/**', '**/*.pyc' }
    from('../chunk-backup-adapter') { into 'chunk-adapter-plugin'; exclude '**/__pycache__/**', '**/*.pyc' }
    from('../requirements-prime-backup.txt')
}
processResources {
    dependsOn tasks.named('bundleInstaller')
    from(tasks.named('bundleInstaller').flatMap { it.archiveFile })
    from('../python/singleplayer_bridge/lang') { into 'assets/mcdr-singleplayer/lang' }
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
test { useJUnitPlatform() }
jar { from('../LICENSE') }

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'singleplayer_bridge_gametest'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Optional upstream mods are loaded only by an explicitly configured integration run.
def testCompatMods = System.getenv('MCDR_BRIDGE_TEST_COMPAT_MODS')
if (testCompatMods) {
    dependencies { gametestRuntimeOnly files(testCompatMods.split(java.io.File.pathSeparator)) }
}
