name: Publish mcdr-singleplayer NeoForge
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published Release tag (v0.3.10)
        required: true
        type: string
      curseforge:
        description: Upload to CurseForge as well as GitHub
        default: true
        type: boolean
permissions:
  contents: write
concurrency:
  group: publish-neoforge-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    uses: ./.github/workflows/publish-loader.yml
    with:
      loader: neoforge
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      curseforge: ${{ github.event_name == 'release' || inputs.curseforge }}
    secrets: inherit
