name: Build and publish loader families
on:
  workflow_call:
    inputs:
      loader:
        required: true
        type: string
      tag:
        required: true
        type: string
      curseforge:
        required: true
        type: boolean
    secrets:
      CURSEFORGE_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        family: [1.21.x, 26.x]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Keep Java 21 toolchain location
        run: echo "MCDR_JAVA_INSTALLATIONS=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Inspect published Release and version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json tagName,isPrerelease,isDraft,body > release-metadata.json
          python scripts/check_release.py
      - name: Run Python tests
        run: |
          python -m pip install -r requirements-dev.txt -r requirements-prime-backup.txt
          python scripts/prepare_test_plugins.py
          python -m pytest -q
      - name: Build all adapters and merge family JAR
        env:
          MOD_LOADER: ${{ inputs.loader }}
          MOD_FAMILY: ${{ matrix.family }}
        run: |
          chmod +x fabric-bridge/gradlew
          python scripts/build_matrix.py --loader "$MOD_LOADER" --family "$MOD_FAMILY" --release
          python scripts/verify_artifacts.py --loader "$MOD_LOADER" --family "$MOD_FAMILY"
      - uses: actions/upload-artifact@v4
        with:
          name: mcdr-singleplayer-${{ inputs.loader }}-${{ matrix.family }}
          path: dist/*.jar
      - name: Attach JAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.jar --clobber
      - name: Upload family JAR to CurseForge
        if: ${{ inputs.curseforge }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MOD_LOADER: ${{ inputs.loader }}
          MOD_FAMILY: ${{ matrix.family }}
        run: python scripts/publish_curseforge.py --loader "$MOD_LOADER" --family "$MOD_FAMILY"
